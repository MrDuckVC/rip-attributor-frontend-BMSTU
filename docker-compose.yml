services:
  app:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_PROXY_TARGET: http://host.docker.internal:8080
      S3_PROXY_TARGET: http://host.docker.internal:9000
      VITE_MINIO_PUBLIC_URL: ${VITE_MINIO_PUBLIC_URL:-http://localhost:9000}
    command: npm run dev

volumes:
  node_modules:
